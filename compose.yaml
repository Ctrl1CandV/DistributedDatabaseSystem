x-app: &app
  image: distributed-routing-demo:local
  build: .

x-mysql-env: &mysql-env
  MYSQL_DATABASE: routing_demo
  MYSQL_USER: routing_demo
  MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?在 .env 设置 DEMO_MYSQL_PASSWORD}

x-mysql: &mysql
  image: mysql:8.4
  environment:
    <<: *mysql-env
    MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:?在 .env 设置 DEMO_MYSQL_ROOT_PASSWORD}
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1
        -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1 FROM students LIMIT 1"
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 20s

x-region-healthcheck: &region-healthcheck
  test:
    - CMD
    - python
    - -c
    - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5001/health', timeout=2)"
  interval: 3s
  timeout: 3s
  retries: 5

services:
  master:
    <<: *app
    command: ["python", "master.py", "--host", "0.0.0.0", "--metadata", "/data/master_state.json"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - master-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/status', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 5

  region-a:
    <<: *app
    command: ["python", "region_server.py", "--name", "region-a", "--host", "0.0.0.0", "--port", "5001", "--advertise", "http://region-a:5001", "--master", "http://master:5000"]
    environment:
      <<: *mysql-env
      MYSQL_HOST: mysql-a
    depends_on:
      master:
        condition: service_healthy
      mysql-a:
        condition: service_healthy
    healthcheck: *region-healthcheck

  region-b:
    <<: *app
    command: ["python", "region_server.py", "--name", "region-b", "--host", "0.0.0.0", "--port", "5001", "--advertise", "http://region-b:5001", "--master", "http://master:5000"]
    environment:
      <<: *mysql-env
      MYSQL_HOST: mysql-b
    depends_on:
      master:
        condition: service_healthy
      mysql-b:
        condition: service_healthy
    healthcheck: *region-healthcheck

  mysql-a:
    <<: *mysql
    volumes:
      - mysql-a-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  mysql-b:
    <<: *mysql
    volumes:
      - mysql-b-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  master-data:
  mysql-a-data:
  mysql-b-data:
